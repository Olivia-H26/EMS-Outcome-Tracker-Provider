<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EMS Outcome Tracker — SMART Launch</title>
  <script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>
</head>
<body>
  <p>Connecting to the SMART health record system...</p>

  <script>
    const FHIR_SERVER =
      "https://launch.smarthealthit.org/v/r4/sim/WzIsIiIsIjQ5NjUyNzUsNDk2NTI3NCw0OTY1MjczIiwiQVVUTyIsMCwwLDAsIiIsIiIsIiIsIiIsIiIsIiIsIiIsMCwyLCIiXQ/fhir";

    const CLIENT_ID = "my_web_app";
    const REDIRECT_URI = new URL("index.html", window.location.href).href;

    const SCOPES = [
      "openid",
      "fhirUser",
      "launch/patient",
      "user/Patient.crs",
      "user/Encounter.crs",
      "user/Condition.crs",
      "user/ClinicalImpression.crs",
      "user/Provenance.crs",
      "user/Practitioner.rs",
      "user/PractitionerRole.rs",
      "user/Organization.rs"
    ].join(" ");

    FHIR.oauth2.authorize({
      clientId: CLIENT_ID,
      scope: SCOPES,
      redirectUri: REDIRECT_URI,
      iss: FHIR_SERVER,
      pkceMode: "required"
    });
  </script>
</body>
</html>
