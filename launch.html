<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Provider Sign In | EMS Outcome Tracker</title>

  <script src="https://cdn.jsdelivr.net/npm/fhirclient@3.0.1/bundle/fhir-client.js"></script>
</head>

<body>
  <main>
    <h1>EMS Outcome Tracker</h1>
    <h2>Provider Sign In</h2>

    <p id="status">
      Connecting to the SMART Health IT R4 server...
    </p>

    <p id="error" style="color: darkred;"></p>
  </main>

  <script>
    // SMART Health IT Provider Standalone configuration.
    // This is the exact FHIR server configured in your launcher.

    var sandboxIss =
      "https://launch.smarthealthit.org/v/r4/sim/WzIsIiIsIiIsIk1BTlVBTCIsMCwwLDAsIiIsIiIsIiIsIiIsIiIsIiIsIiIsMCwyLCIiXQ/fhir";

    // Provider standalone authorization.
    // No launch/patient scope is requested.

    FHIR.oauth2.authorize({
      clientId: "my_web_app",

      scope: [
        "openid",
        "fhirUser",
        "user/Patient.read"
      ].join(" "),

      redirectUri: "index.html",

      iss: sandboxIss
    }).catch(function(error) {
      document.getElementById("status").textContent =
        "Provider sign-in could not be started.";

      document.getElementById("error").textContent =
        error.message || String(error);
    });
  </script>
</body>
</html>
