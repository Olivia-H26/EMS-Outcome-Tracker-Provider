<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMS Duplicate Checker</title>
<script src="https://cdn.jsdelivr.net/npm/fhirclient@3.0.1/bundle/fhir-client.js"></script>
<style>
body {
  font-family: system-ui, sans-serif;
  max-width: 750px;
  margin: 35px auto;
  padding: 20px;
  color: #243447;
  background: #f3f6f9;
}
main {
  background: white;
  padding: 25px;
  border-radius: 12px;
  border: 1px solid #d9e2ea;
}
h1 { color: #173b57; }
button {
  padding: 12px 18px;
  background: #235d82;
  color: white;
  border: 0;
  border-radius: 7px;
  cursor: pointer;
  margin: 8px 0;
}
pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  background: #edf3f7;
  padding: 15px;
  border-radius: 7px;
}
</style>
</head>
<body>
<main>
<h1>EMS Outcome Tracker</h1>
<h2>Duplicate Record Checker</h2>

<p>This page checks the existing synthetic test records.</p>
<p><strong>It does not create, update, or delete anything.</strong></p>

<p id="status">Connecting to the SMART sandbox...</p>

<button id="login" hidden>Authorize read-only access</button>
<button id="inspect" hidden>Check duplicate records</button>

<pre id="results">Waiting for connection...</pre>
</main>

<script>
"use strict";

const SERVER =
"https://launch.smarthealthit.org/v/r4/sim/WzIsIiIsIiIsIk1BTlVBTCIsMCwwLDAsIiIsIiIsIiIsIiIsIiIsIiIsIiIsMCwyLCIiXQ/fhir";

const CLIENT_ID = "my_web_app";

const REDIRECT_URI =
window.location.origin + window.location.pathname;

const SCOPES = [
  "openid",
  "fhirUser",
  "user/Encounter.rs",
  "user/Condition.rs"
].join(" ");

const ENCOUNTER_IDS = [
  "4949143",
  "4949145",
  "4949147",
  "4949149"
];

const CONDITION_IDS = [
  "4949144",
  "4949146",
  "4949148",
  "4949150"
];

let client = null;

const status = document.getElementById("status");
const results = document.getElementById("results");
const loginButton = document.getElementById("login");
const inspectButton = document.getElementById("inspect");

function authorize() {
  FHIR.oauth2.authorize({
    clientId: CLIENT_ID,
    scope: SCOPES,
    redirectUri: REDIRECT_URI,
    iss: SERVER,
    pkceMode: "required"
  }).catch(error => {
    status.textContent = "Authorization failed.";
    results.textContent = error.message || String(error);
  });
}

loginButton.addEventListener("click", authorize);

function getText(concept) {
  if (!concept) return "Not recorded";

  if (concept.text) return concept.text;

  if (Array.isArray(concept.coding)) {
    return concept.coding
      .map(item => item.display || item.code)
      .filter(Boolean)
      .join(", ");
  }

  return "Not recorded";
}

function getReference(reference) {
  if (!reference) return [];

  const items = Array.isArray(reference)
    ? reference
    : [reference];

  return items.map(item => ({
    reference: item.reference || "",
    display: item.display || ""
  }));
}

function hasDemoTag(resource) {
  return (resource.meta?.tag || []).some(tag =>
    tag.system ===
      "https://olivia-h26.github.io/EMS-Outcome-Tracker-Provider/demo" &&
    tag.code === "synthetic-demo"
  );
}

function summarizeEncounter(resource) {
  return {
    id: resource.id,
    type: getText(resource.type),
    status: resource.status,
    class: resource.class?.code || "",
    start: resource.period?.start || "",
    patient: resource.subject?.reference || "",
    reasonReference: getReference(resource.reasonReference),
    syntheticDemoTag: hasDemoTag(resource)
  };
}

function summarizeCondition(resource) {
  const verification = resource.verificationStatus?.coding || [];

  return {
    id: resource.id,
    code: getText(resource.code),
    verificationStatus: verification.map(item => item.code),
    encounter: resource.encounter?.reference || "",
    patient: resource.subject?.reference || "",
    syntheticDemoTag: hasDemoTag(resource)
  };
}

async function readResource(type, id) {
  return client.request(type + "/" + id);
}

async function inspectRecords() {
  inspectButton.disabled = true;
  status.textContent = "Checking the eight records...";
  results.textContent = "";

  try {
    const encounterResults = await Promise.all(
      ENCOUNTER_IDS.map(id =>
        readResource("Encounter", id)
      )
    );

    const conditionResults = await Promise.all(
      CONDITION_IDS.map(id =>
        readResource("Condition", id)
      )
    );

    const encounters = encounterResults.map(
      summarizeEncounter
    );

    const conditions = conditionResults.map(
      summarizeCondition
    );

    const report = {
      patient: "Antonio Carmona",
      patientId: "845ac958-8036-45ee-9112-eac31d9b4f30",
      encounters: encounters,
      conditions: conditions
    };

    results.textContent = JSON.stringify(report, null, 2);

    status.textContent =
      "Inspection complete. No records were changed.";

  } catch (error) {
    status.textContent = "Could not inspect all records.";

    results.textContent =
      error.message || String(error);

  } finally {
    inspectButton.disabled = false;
  }
}

inspectButton.addEventListener(
  "click",
  inspectRecords
);

if (!window.FHIR || !FHIR.oauth2) {
  status.textContent =
    "SMART library did not load. Refresh the page.";
} else {
  FHIR.oauth2.ready()
    .then(authorizedClient => {
      client = authorizedClient;
      status.textContent =
        "Connected with read-only access. Ready to inspect.";
      inspectButton.hidden = false;
    })
    .catch(() => {
      status.textContent =
        "Please authorize read-only access.";
      loginButton.hidden = false;
    });
}
</script>
</body>
</html>
